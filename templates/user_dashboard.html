<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Viewer | CreatorPay</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="dashboard-body">
    <div class="main-container">
        <header>
            <div class="logo">Welcome, Viewer: {{ email }}</div>
            <a href="{{ url_for('logout') }}" class="btn-logout haptic-click">Logout</a>
        </header>

        <section class="viewer-grid">
            {% if content %}
                {% for item in content %}
                <div class="content-viewer-card">
                    <div class="viewer-thumb">🎬</div>
                    <div class="viewer-info">
                        <div class="viewer-title">{{ item.title }}</div>
                        <div class="viewer-meta">Uploaded on: {{ item.date }} • By: {{ item.creator_name }}</div>
                    </div>
                    <div class="viewer-actions">
                        <button onclick="likeContent('{{ item.id }}')" class="interaction-btn haptic-click">👍 Like</button>
                        <button onclick="toggleComment('{{ item.id }}')" class="interaction-btn haptic-click">💬 Comment</button>
                        <button onclick="alert('Unique Views: {{ item.unique_views }}')" class="interaction-btn haptic-click">👁️ {{ item.unique_views }}</button>
                    </div>
                    <!-- Comment Section stub -->
                    <div id="comment-{{ item.id }}" style="display: none; padding: 20px; background: #fff; border-top: 3px solid #000;">
                        <textarea id="comment-text-{{ item.id }}" placeholder="Add a public comment..." style="width: 100%; height: 60px; border: 2px solid #000; border-radius: 8px; padding: 10px;"></textarea>
                        <button onclick="submitComment('{{ item.id }}')" class="btn-primary haptic-click" style="width: auto; padding: 5px 15px; margin-top: 10px;">Post</button>
                    </div>
                </div>
                {% endfor %}
            {% else %}
                <div class="status-banner" style="grid-column: 1 / -1;">
                    No content available yet. Check back later!
                </div>
            {% endif %}
        </section>
    </div>

    <script>
        function likeContent(id) {
            fetch('/api/user/like_content', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({content_id: id})
            }).then(r => r.json()).then(data => {
                if(data.status === 'success') alert('Liked!');
            });
        }

        function toggleComment(id) {
            const el = document.getElementById('comment-' + id);
            el.style.display = el.style.display === 'none' ? 'block' : 'none';
        }

        function submitComment(id) {
            const body = document.getElementById('comment-text-' + id).value;
            fetch('/api/user/add_comment', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({content_id: id, body: body})
            }).then(r => r.json()).then(data => {
                if(data.status === 'success') {
                    alert('Comment added!');
                    document.getElementById('comment-text-' + id).value = '';
                    toggleComment(id);
                }
            });
        }
    </script>
</body>
</html>

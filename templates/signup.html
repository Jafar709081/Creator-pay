<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Creator Revenue Distribution Engine</title>
    <meta name="description" content="Join the Creator Revenue Distribution Engine - A manipulation-resistant platform for fair revenue sharing.">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="signup-container">
        <h1>Create Account</h1>
        <p class="subtitle">Join the Revenue Distribution Engine</p>

        {% if error %}
        <div class="error-msg">
            {{ error }}
        </div>
        {% endif %}

        <form action="/signup" method="POST">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" placeholder="name@example.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Create Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <div class="input-wrapper">
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
                </div>
            </div>

            <div class="form-group">
                <label for="role">Select Role</label>
                <div class="input-wrapper">
                    <select id="role" name="role" required>
                        <option value="" disabled selected>Choose your role</option>
                        <option value="Admin">Admin</option>
                        <option value="Creator">Creator</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-register haptic-click">Register</button>
        </form>

        <p class="footer-text">
            Already have an account? <a href="{{ url_for('login') }}">Log In</a>
        </p>
    </div>
</body>
</html>
